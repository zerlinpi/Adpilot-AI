# AdPilot AI - Nginx Configuration
# ============================================================
# Frontend : https://your-domain.example      (static SPA)
# Backend  : https://api.your-domain.example  (Spring Boot on 127.0.0.1:8090)
#
# The frontend build calls the backend cross-origin via VITE_API_BASE_URL
# (=https://api.your-domain.example). The backend CORS allowed-origins
# includes https://your-domain.example (application-prod.yml).
#
# Replace the ssl_certificate paths with your real certs (e.g. Let's Encrypt).
# ============================================================

# ---- Frontend: serve the SPA over HTTPS ----
server {
    listen 443 ssl;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    root /opt/adpilot/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 50M;
}

# ---- Backend: reverse-proxy to Spring Boot over HTTPS ----
server {
    listen 443 ssl;
    server_name api.your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/api.your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.example/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    client_max_body_size 50M;
}

# ---- Redirect plain HTTP to HTTPS ----
server {
    listen 80;
    server_name your-domain.example api.your-domain.example;
    return 301 https://$host$request_uri;
}
